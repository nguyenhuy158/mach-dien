<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mạch điện tử cơ bản">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CB6FF"/>
      <stop offset="1" stop-color="#3B72E0"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="8"/>

  <!-- pins -->
  <g fill="#fff">
    <rect x="74" y="176" width="64" height="28" rx="14"/>
    <rect x="74" y="238" width="64" height="28" rx="14"/>
    <rect x="74" y="300" width="64" height="28" rx="14"/>
    <rect x="374" y="176" width="64" height="28" rx="14"/>
    <rect x="374" y="238" width="64" height="28" rx="14"/>
    <rect x="374" y="300" width="64" height="28" rx="14"/>
  </g>

  <!-- chip body -->
  <rect x="118" y="140" width="276" height="234" rx="48" fill="#17202E" stroke="#fff" stroke-width="14"/>
  <circle cx="158" cy="180" r="11" fill="#fff" fill-opacity=".55"/>

  <!-- face -->
  <g fill="#fff">
    <ellipse cx="209" cy="243" rx="21" ry="25"/>
    <ellipse cx="303" cy="243" rx="21" ry="25"/>
  </g>
  <g fill="#FF7A9C">
    <ellipse cx="165" cy="288" rx="19" ry="12"/>
    <ellipse cx="347" cy="288" rx="19" ry="12"/>
  </g>
  <path d="M228 296q28 28 56 0" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>

  <!-- bolt badge -->
  <g transform="translate(404 116) rotate(10) scale(1.35)">
    <path d="M12 -46 L-22 6 L0 6 L-10 48 L24 -4 L2 -4 Z"
          fill="#FFD23F" stroke="#fff" stroke-width="9" stroke-linejoin="round"/>
  </g>
</svg>
